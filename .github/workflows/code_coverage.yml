name: code_coverage

on:
  workflow_dispatch:

permissions:
  contents: read

env:
  BUILD_TYPE: Debug

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v6

    - name: Install Clang 19
      run: |
        wget -O - https://apt.llvm.org/llvm-snapshot.gpg.key | sudo apt-key add -
        echo "deb http://apt.llvm.org/noble/ llvm-toolchain-noble-19 main" | sudo tee /etc/apt/sources.list.d/llvm.list
        sudo apt-get update
        sudo apt-get install -y --fix-missing clang-19 llvm-19

    - name: Set up environment
      run: |
        echo "CXX=clang++-19" >> "$GITHUB_ENV"
        echo "CC=clang-19" >> "$GITHUB_ENV"
        echo "CXXFLAGS="-fprofile-instr-generate -fcoverage-mapping"" >> "$GITHUB_ENV"
        echo "LDFLAGS="-fprofile-instr-generate"" >> "$GITHUB_ENV"
        echo "LLVM_PROFILE_FILE="code-%p.profraw"" >> "$GITHUB_ENV"

    - name: Have llvm-cov point to llvm-cov-19
      run: |
        mkdir -p /home/runner/.local/bin
        ln -s `which llvm-cov-19` /home/runner/.local/bin/llvm-cov
        ln -s `which llvm-profdata-19` /home/runner/.local/bin/llvm-profdata

    - name: Configure CMake
      run: cmake -B ${{github.workspace}}/build -DCMAKE_BUILD_TYPE=${{env.BUILD_TYPE}}

    - name: Configure CMake with code coverage enabled
      run: cmake -B ${{github.workspace}}/build -DCMAKE_BUILD_TYPE=${{env.BUILD_TYPE}} -DCODE_COVERAGE=ON

    - name: Build code coverage target
      run: cmake --build build --config ${{env.BUILD_TYPE}} --target ccov-all -j 2

    - name: Archive code coverage results
      uses: actions/upload-artifact@v3
      with:
        name: code-coverage-report
        path: ${{github.workspace}}/build/ccov/all-merged
