name: gcc-erlang

on:
  push:
    branches:
      - main
      - feature/*
    paths-ignore:
      - '**/*.md'
      - 'docs/**'
  pull_request:
    branches:
      - main
    paths-ignore:
      - '**/*.md'
      - 'docs/**'
  workflow_dispatch:

concurrency:
  # Supersede an in-flight run when a branch is pushed again, so a fixup commit
  # does not leave the previous run competing for the same runners. Pushes to main
  # are exempt: every merged commit keeps a completed CI record.
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  build:
    runs-on: ubuntu-24.04

    strategy:
      fail-fast: false
      matrix:
        gcc: [13, 14]
        build_type: [Debug]
        std: [23]

    env:
      CC: gcc-${{matrix.gcc}}
      CXX: g++-${{matrix.gcc}}

    steps:
    - name: Install Dependencies
      run: |
          sudo apt-get update
          sudo apt-get install erlang-dev

    - uses: actions/checkout@v6

    - name: Configure CMake
      run: |
        CXXFLAGS="-g3" cmake -B ${{github.workspace}}/build \
          -DCMAKE_BUILD_TYPE=${{matrix.build_type}} \
          -DCMAKE_CXX_STANDARD=${{matrix.std}} \
          -Dglaze_EETF_FORMAT=ON

    - name: Build
      run: cmake --build build -j $(nproc) --target eetf_test

    - name: Test
      run: ctest --output-on-failure --test-dir ${{github.workspace}}/build -R eetf_test
