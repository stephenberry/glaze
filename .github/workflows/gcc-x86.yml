name: gcc-x86

on:
  push:
    branches:
      - main
      - feature/*
    paths-ignore:
      - '**/*.md'
      - 'docs/**'
  pull_request:
    branches:
      - main
    paths-ignore:
      - '**/*.md'
      - 'docs/**'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # Supersede an in-flight run when a branch is pushed again, so a fixup commit
  # does not leave the previous run competing for the same runners. Pushes to main
  # are exempt: every merged commit keeps a completed CI record.
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
   build:
      runs-on: ubuntu-26.04

      strategy:
         fail-fast: false
         matrix:
            gcc: [13, 14]
            build_type: [Debug]
            std: [23]

      env:
         CC: gcc-${{matrix.gcc}}
         CXX: g++-${{matrix.gcc}}

      steps:
         - uses: actions/checkout@v7

         - name: Setup environment
           run: |
              # The ubuntu-26.04 runner image ships a packages.microsoft.com source that
              # currently answers 403 for resolute, which makes apt update fail before the
              # multilib packages are even considered. This job needs only Ubuntu packages,
              # so drop any source file that points at that repository.
              sudo find /etc/apt/sources.list.d -maxdepth 1 -type f \
                 \( -name '*.list' -o -name '*.sources' \) \
                 -exec grep -l 'packages.microsoft.com' {} + 2>/dev/null \
                 | xargs -r sudo rm -f
              sudo apt update
              sudo apt-get install -y gcc-${{matrix.gcc}}-multilib g++-${{matrix.gcc}}-multilib libc6-dev-i386
              
         - name: Configure CMake
           run: |
              CXXFLAGS="-g3 -m32" cmake -B ${{github.workspace}}/build -DCMAKE_BUILD_TYPE=${{matrix.build_type}} -DCMAKE_CXX_STANDARD=${{matrix.std}} -Dglaze_BUILD_SSL_TESTS=OFF
              
         - name: Build
           run: cmake --build build -j $(nproc)

         - name: Test
           run: ctest --output-on-failure --test-dir ${{github.workspace}}/build