name: msys2-mingw

# MinGW is supported on a best-effort basis. The full build is slow on Windows runners,
# so it runs only on merges to main (and on demand), not on pull requests or feature branches.
on:
  push:
    branches:
      - main
    paths-ignore:
      - '**/*.md'
      - 'docs/**'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  BUILD_TYPE: Release
  CMAKE_GENERATOR: Ninja

jobs:
  build:
    runs-on: windows-latest
    defaults:
      run:
        shell: msys2 {0}
    steps:
    - uses: actions/checkout@v6
    - uses: msys2/setup-msys2@v2
      with:
        update: true
        msystem: MINGW64
        install: mingw-w64-x86_64-cmake mingw-w64-x86_64-ninja mingw-w64-x86_64-gcc

    # Fuzzers and performance tests add build time without covering anything
    # MinGW-specific; the Windows/libstdc++ surface is in the unit and networking tests.
    - name: Configure CMake
      run: >
        cmake -B build
        -DCMAKE_BUILD_TYPE=${{env.BUILD_TYPE}}
        -Dglaze_ENABLE_FUZZING=OFF
        -Dglaze_BUILD_PERFORMANCE_TESTS=OFF

    - name: Build
      run: cmake --build build --config ${{env.BUILD_TYPE}} -j $(nproc)

    - name: Test
      working-directory: build
      run: ctest -C ${{env.BUILD_TYPE}} -j $(nproc) --output-on-failure
