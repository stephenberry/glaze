name: clang

on:
  push:
    branches:
      - main
      - feature/*
    paths-ignore:
      - '**/*.md'
      - 'docs/**'
  pull_request:
    branches:
      - main
    paths-ignore:
      - '**/*.md'
      - 'docs/**'
  workflow_dispatch:

env:
  BUILD_TYPE: Debug

concurrency:
  # Supersede an in-flight run when a branch is pushed again, so a fixup commit
  # does not leave the previous run competing for the same runners. Pushes to main
  # are exempt: every merged commit keeps a completed CI record.
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  build:
    runs-on: macos-latest

    steps:
    - uses: actions/checkout@v6

    - uses: maxim-lobanov/setup-xcode@v1
      with:
        xcode-version: latest-stable

    - name: Configure CMake
      run: cmake -B ${{github.workspace}}/build -DCMAKE_BUILD_TYPE=${{env.BUILD_TYPE}}

    - name: Build
      run: cmake --build build --config ${{env.BUILD_TYPE}} -j 3

    - name: Test
      working-directory: build
      run: ctest -C ${{env.BUILD_TYPE}} -j 3 --output-on-failure
