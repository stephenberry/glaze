name: msvc

on:
  push:
    branches:
      - main
      - feature/*
    paths-ignore:
      - '**/*.md'
      - 'docs/**'
  pull_request:
    branches:
      - main
    paths-ignore:
      - '**/*.md'
      - 'docs/**'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # Supersede an in-flight run when a branch is pushed again, so a fixup commit
  # does not leave the previous run competing for the same runners. Pushes to main
  # are exempt: every merged commit keeps a completed CI record.
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  build:
    runs-on: windows-2025-vs2026
    timeout-minutes: 60

    strategy:
      matrix:
        cpp_version: [23]
        # A Release build here runs well past 30 minutes, which is too long to spend on every
        # push and pull request. It runs on merges to main, where a slow and complete check is
        # worth having on the record, and on a manual dispatch when a branch wants one before
        # merging. Everywhere else Debug stands guard on its own.
        build_type: ${{ (github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && github.ref == 'refs/heads/main')) && fromJSON('["Debug", "Release"]') || fromJSON('["Debug"]') }}

    steps:
    - uses: actions/checkout@v6

    - name: Configure CMake
      run: cmake -B ${{github.workspace}}/build -DCMAKE_BUILD_TYPE=${{matrix.build_type}} -DCMAKE_CXX_STANDARD=${{matrix.cpp_version}}

    - name: Build
      run: cmake --build build --config ${{matrix.build_type}} --parallel

    - name: Test
      working-directory: build
      run: ctest --output-on-failure --build-config ${{matrix.build_type}} --timeout 300
