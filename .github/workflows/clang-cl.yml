name: clang-cl

on:
  push:
    branches:
      - main
      - feature/*
    paths-ignore:
      - '**/*.md'
      - 'docs/**'
  pull_request:
    branches:
      - main
    paths-ignore:
      - '**/*.md'
      - 'docs/**'
  workflow_dispatch:

permissions:
  contents: read

env:
  CTEST_OUTPUT_ON_FAILURE: 1
  BUILD_TYPE: Debug

concurrency:
  # Supersede an in-flight run when a branch is pushed again, so a fixup commit
  # does not leave the previous run competing for the same runners. Pushes to main
  # are exempt: every merged commit keeps a completed CI record.
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  build-direct-clang-cl:
    runs-on: windows-2025
    timeout-minutes: 60

    steps:
    - uses: actions/checkout@v7

    - name: Configure, build and test with clang-cl
      shell: cmd
      run: |
        for %%I in (cmake.exe) do set "CMAKE_BIN=%%~dp$PATH:I"
        "%ProgramFiles(x86)%\Microsoft Visual Studio\Installer\vswhere.exe" -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 Microsoft.VisualStudio.Component.VC.Llvm.Clang -property installationPath > "%RUNNER_TEMP%\vsinstall.txt" || exit /b 1
        set /p VSINSTALL=<"%RUNNER_TEMP%\vsinstall.txt"
        if not defined VSINSTALL (echo No Visual Studio installation with the C++ toolset and bundled Clang was found & exit /b 1)
        set "CLANG_CL=%VSINSTALL%\VC\Tools\Llvm\x64\bin\clang-cl.exe"
        if not exist "%CLANG_CL%" (echo Visual Studio's bundled clang-cl.exe was not found & exit /b 1)
        "%CLANG_CL%" --version || exit /b 1
        set "CLANG_CL=%CLANG_CL:\=/%"
        call "%VSINSTALL%\VC\Auxiliary\Build\vcvarsall.bat" x64 || exit /b 1
        set "PATH=%CMAKE_BIN%;%PATH%"
        cmake -B build-direct-clang-cl -G Ninja "-DCMAKE_C_COMPILER=%CLANG_CL%" "-DCMAKE_CXX_COMPILER=%CLANG_CL%" -DCMAKE_BUILD_TYPE=%BUILD_TYPE% -DCMAKE_CXX_STANDARD=23 || exit /b 1
        cmake --build build-direct-clang-cl --parallel || exit /b 1
        ctest --test-dir build-direct-clang-cl --no-tests=error --timeout 300 || exit /b 1
