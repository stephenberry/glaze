name: Install Clang
description: >
  Installs a Clang release on an Ubuntu runner. Packages come from the Ubuntu archive
  when it carries that release, and from apt.llvm.org otherwise, so a runner image
  upgrade only needs apt.llvm.org for releases newer than the distribution ships.

inputs:
  version:
    description: Clang major version, for example 19.
    required: true
  packages:
    description: >
      Space-separated packages to install. Defaults to clang, libc++ and libc++abi of
      the requested version.
    required: false
    default: ''

runs:
  using: composite
  steps:
    - name: Install Clang ${{ inputs.version }}
      shell: bash
      env:
        CLANG_VERSION: ${{ inputs.version }}
        CLANG_PACKAGES: ${{ inputs.packages }}
      run: |
        set -euo pipefail
        packages="${CLANG_PACKAGES:-clang-$CLANG_VERSION libc++-$CLANG_VERSION-dev libc++abi-$CLANG_VERSION-dev}"

        sudo apt-get update
        if apt-cache show "clang-$CLANG_VERSION" > /dev/null 2>&1; then
          echo "Installing Clang $CLANG_VERSION from the Ubuntu archive"
        else
          codename="$(. /etc/os-release && echo "$VERSION_CODENAME")"
          echo "Installing Clang $CLANG_VERSION from apt.llvm.org ($codename)"
          sudo install -d -m 0755 /etc/apt/keyrings
          curl -fsSL https://apt.llvm.org/llvm-snapshot.gpg.key | sudo gpg --dearmor --yes -o /etc/apt/keyrings/llvm.gpg
          echo "deb [signed-by=/etc/apt/keyrings/llvm.gpg] https://apt.llvm.org/$codename/ llvm-toolchain-$codename-$CLANG_VERSION main" \
            | sudo tee /etc/apt/sources.list.d/llvm.list
          sudo apt-get update
        fi

        # Word splitting of the package list is intended
        # shellcheck disable=SC2086
        sudo apt-get install -y $packages

        echo "/usr/lib/llvm-$CLANG_VERSION/bin" >> "$GITHUB_PATH"
        "clang++-$CLANG_VERSION" --version
